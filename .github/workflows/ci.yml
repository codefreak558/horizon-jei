name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy and tests against the pinned SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain the launcher builds native mods with (the SDK's sdk.json pins it).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # The SDK's API crate, from the signed sdk-<commit> release, checked by SHA-256.
      - uses: actions/cache@v4
        with:
          path: .horizon/sdk
          key: sdk-${{ hashFiles('tools/fetch-sdk.sh') }}
      - name: fetch the SDK
        run: tools/fetch-sdk.sh
      - name: format
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      # The package rules the launcher applies to a native mod folder: Rust only under src/, a manifest with
      # [native], no build.rs.
      - name: package layout
        run: |
          bad=$(git ls-files '*.rs' | grep -v '^src/' || true)
          if [ -n "$bad" ]; then echo "::error::Rust files outside src/ refuse the package:"; echo "$bad"; exit 1; fi
          test ! -e build.rs
          grep -q '^\[native\]' horizon-mod.toml
